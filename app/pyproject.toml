[project]
name = "price-advisor"
version = "0.1.0"
description = "定价参谋：给中小电商店主的定价参谋，改价前算清毛利，只建议不代改"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
advisor = "advisor.main:run"
advisor-backup = "advisor.tools:backup_main"
advisor-restore = "advisor.tools:restore_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["advisor"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
