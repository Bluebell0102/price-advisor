[project]
name = "price-advisor-gate0"
version = "0.1.0"
description = "定价工具门 0 体检：一次性脚本，不进产品仓库"
requires-python = ">=3.12"
dependencies = ["openpyxl>=3.1"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
gate0 = "gate0.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gate0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
